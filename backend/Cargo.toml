[package]
name = "backend"
version = "0.2.0"
edition = "2024"

[lib]
name = "backend"
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "uuid",
  "migrate",
] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "limit"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
