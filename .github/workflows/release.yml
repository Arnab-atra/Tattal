name: Tattal Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: tattal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # PREPARE RELEASE
  # ============================================================

  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest

    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create or find draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e

          echo "Checking release for $TAG..."

          RELEASE_ID=$(gh release view "$TAG" \
            --json databaseId \
            --jq '.databaseId' 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "No release found. Creating draft release..."

            gh release create "$TAG" \
              --draft \
              --title "Tattal $TAG" \
              --notes "Tattal $TAG

            Local business sales and inventory management application.

            ## Linux

            - .deb — Debian / Ubuntu and compatible distributions
            - .rpm — Fedora / RHEL / openSUSE and compatible distributions
            - .AppImage — Portable Linux application

            ## Windows

            - .exe — NSIS installer
            - .msi — Windows Installer

            Download the installer appropriate for your operating system."

            RELEASE_ID=$(gh release view "$TAG" \
              --json databaseId \
              --jq '.databaseId')
          else
            echo "Existing release found: $RELEASE_ID"
          fi

          echo "Release ID: $RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux - DEB RPM AppImage
    needs: prepare-release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            src-tauri

      - name: Check Rust formatting
        run: |
          cargo fmt \
            --manifest-path backend/Cargo.toml \
            --all \
            -- \
            --check

          cargo fmt \
            --manifest-path src-tauri/Cargo.toml \
            --all \
            -- \
            --check

      - name: Check backend
        run: cargo check --manifest-path backend/Cargo.toml --locked

      - name: Check Tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build and upload Linux
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles deb,rpm,appimage

  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Windows - MSI NSIS
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            src-tauri

      - name: Check Rust formatting
        shell: pwsh
        run: |
          cargo fmt `
            --manifest-path backend/Cargo.toml `
            --all `
            -- `
            --check

          cargo fmt `
            --manifest-path src-tauri/Cargo.toml `
            --all `
            -- `
            --check

      - name: Check backend
        run: cargo check --manifest-path backend/Cargo.toml --locked

      - name: Check Tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build and upload Windows
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles msi,nsis
