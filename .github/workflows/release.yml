name: Tattal Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: tattal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux - DEB RPM AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            src-tauri

      - name: Check Rust formatting
        run: |
          cargo fmt \
            --manifest-path backend/Cargo.toml \
            --all \
            -- \
            --check

          cargo fmt \
            --manifest-path src-tauri/Cargo.toml \
            --all \
            -- \
            --check

      - name: Check backend
        run: cargo check --manifest-path backend/Cargo.toml --locked

      - name: Check Tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build and publish Linux
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Tattal ${{ github.ref_name }}"
          releaseBody: |
            ## Tattal ${{ github.ref_name }}

            Local business sales and inventory management application.

            ### Linux

            - `.deb` — Debian / Ubuntu and compatible distributions
            - `.rpm` — Fedora / RHEL / openSUSE and compatible distributions
            - `.AppImage` — Portable Linux application

            ### Windows

            - `.exe` — NSIS installer
            - `.msi` — Windows Installer

            Download the installer appropriate for your operating system.
          releaseDraft: true
          prerelease: false
          args: --bundles deb,rpm,appimage


  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Windows - MSI NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            src-tauri

      - name: Check Rust formatting
        shell: pwsh
        run: |
          cargo fmt `
            --manifest-path backend/Cargo.toml `
            --all `
            -- `
            --check

          cargo fmt `
            --manifest-path src-tauri/Cargo.toml `
            --all `
            -- `
            --check

      - name: Check backend
        run: cargo check --manifest-path backend/Cargo.toml --locked

      - name: Check Tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Tattal ${{ github.ref_name }}"
          releaseBody: |
            ## Tattal ${{ github.ref_name }}

            Local business sales and inventory management application.

            ### Windows

            - `.exe` — NSIS installer
            - `.msi` — Windows Installer

            ### Linux

            - `.deb` — Debian / Ubuntu and compatible distributions
            - `.rpm` — Fedora / RHEL / openSUSE and compatible distributions
            - `.AppImage` — Portable Linux application

            Download the installer appropriate for your operating system.
          releaseDraft: true
          prerelease: false
          args: --bundles msi,nsis
